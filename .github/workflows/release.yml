# Memex Release CI
#
# Triggered on tag push (v*)
# Builds memex binary for macOS arm64
# Downloads vimo-agent from ai-cli-session-db release
# Uploads both to GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  AGENT_VERSION: v0.0.1-beta.5  # vimo-agent version from ai-cli-session-db

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: macos-14  # Apple Silicon runner
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ai-cli-session-db (as ai-cli-session-db)
        uses: actions/checkout@v4
        with:
          repository: vimo-ai/ai-cli-session-db
          path: deps/ai-cli-session-db

      - name: Checkout ai-cli-session-collector
        uses: actions/checkout@v4
        with:
          repository: vimo-ai/ai-cli-session-collector
          path: deps/ai-cli-session-collector

      - name: Create symlinks for dependencies
        run: |
          # memex-rs/Cargo.toml uses path = "../../ai-cli-session-db"
          # From memex-rs/, ../../ goes to parent of memex repo
          ln -s $GITHUB_WORKSPACE/deps/ai-cli-session-db $GITHUB_WORKSPACE/../ai-cli-session-db
          ln -s $GITHUB_WORKSPACE/deps/ai-cli-session-collector $GITHUB_WORKSPACE/../ai-cli-session-collector

      - name: Install protobuf
        run: brew install protobuf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        working-directory: memex-rs
        run: |
          cargo build --release --target aarch64-apple-darwin

      - name: Download vimo-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ env.AGENT_VERSION }} \
            --repo vimo-ai/ai-cli-session-db \
            --pattern "vimo-agent" \
            --dir .

          chmod +x vimo-agent
          codesign -f -s - vimo-agent

          # Get agent info
          AGENT_SHA256=$(shasum -a 256 vimo-agent | cut -d' ' -f1)
          echo "AGENT_SHA256=$AGENT_SHA256" >> $GITHUB_ENV

          echo "### vimo-agent" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ env.AGENT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: \`$AGENT_SHA256\`" >> $GITHUB_STEP_SUMMARY

      - name: Prepare artifact
        id: artifact
        run: |
          BINARY="memex-rs/target/aarch64-apple-darwin/release/memex"

          # Get size
          SIZE=$(stat -f%z "$BINARY")
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)

          # Get sha256
          SHA256=$(shasum -a 256 "$BINARY" | cut -d' ' -f1)

          # Get version from tag
          VERSION=${GITHUB_REF#refs/tags/v}

          # Copy to final location
          cp "$BINARY" memex-darwin-arm64
          chmod +x memex-darwin-arm64

          # Create checksum file
          shasum -a 256 memex-darwin-arm64 > memex-darwin-arm64.sha256

          # Sign binary (ad-hoc)
          codesign -f -s - memex-darwin-arm64

          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${SIZE_MB}MB" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: \`$SHA256\`" >> $GITHUB_STEP_SUMMARY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            memex-darwin-arm64
            memex-darwin-arm64.sha256
            vimo-agent
          body: |
            ## Memex v${{ steps.artifact.outputs.version }}

            macOS arm64 - Claude Code 会话历史管理

            ### 产物

            | 文件 | 说明 | SHA256 |
            |------|------|--------|
            | `memex-darwin-arm64` | Memex 主程序 | `${{ steps.artifact.outputs.sha256 }}` |
            | `vimo-agent` | Agent 守护进程 | `${{ env.AGENT_SHA256 }}` |

            ### 安装

            ```bash
            mkdir -p ~/.vimo/bin

            # 下载 memex
            curl -L -o ~/.vimo/bin/memex \
              https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/memex-darwin-arm64
            chmod +x ~/.vimo/bin/memex

            # 下载 vimo-agent
            curl -L -o ~/.vimo/bin/vimo-agent \
              https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/vimo-agent
            chmod +x ~/.vimo/bin/vimo-agent
            ```

            ### 依赖

            - vimo-agent: ${{ env.AGENT_VERSION }} (from ai-cli-session-db)
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
