# Memex Lite Release CI
#
# Triggered on tag push (lite-v*)
# Builds memex-lite binary for:
# - macOS arm64 (Apple Silicon)
# - macOS x64 (Intel)
# - Linux x64
#
# Uploads to GitHub Release with sha256 checksums

name: Release Lite

on:
  push:
    tags:
      - 'lite-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        default: '0.0.1-beta.1'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: memex

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: memex-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: memex-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: memex-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ai-cli-session-collector
        uses: actions/checkout@v4
        with:
          repository: vimo-ai/ai-cli-session-collector
          path: deps/ai-cli-session-collector

      - name: Create symlink for dependency
        run: |
          # memex-lite uses git dependency, but we can override with local path
          # Create symlink so [patch] in workspace can find it
          ln -s $GITHUB_WORKSPACE/deps/ai-cli-session-collector $GITHUB_WORKSPACE/../ai-cli-session-collector

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: memex-lite
          key: ${{ matrix.target }}

      - name: Build
        working-directory: memex-lite
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        id: artifact
        run: |
          BINARY="memex-lite/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          ARTIFACT="${{ matrix.artifact }}"

          # Copy binary as 'memex' (unified name inside tarball)
          cp "$BINARY" memex
          chmod +x memex

          # Get sha256
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            SHA256=$(shasum -a 256 memex | cut -d' ' -f1)
            SIZE=$(stat -f%z memex)
          else
            SHA256=$(sha256sum memex | cut -d' ' -f1)
            SIZE=$(stat -c%s memex)
          fi
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)

          # Create tarball (tarball name includes platform, but binary inside is just 'memex')
          tar -czf "${ARTIFACT}.tar.gz" memex
          rm memex

          # Checksum for tarball
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            TAR_SHA256=$(shasum -a 256 "${ARTIFACT}.tar.gz" | cut -d' ' -f1)
          else
            TAR_SHA256=$(sha256sum "${ARTIFACT}.tar.gz" | cut -d' ' -f1)
          fi

          echo "sha256=$TAR_SHA256" >> $GITHUB_OUTPUT
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "artifact=${ARTIFACT}.tar.gz" >> $GITHUB_OUTPUT

          echo "### Build Summary (${{ matrix.artifact }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${SIZE_MB}MB" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: \`$TAR_SHA256\`" >> $GITHUB_STEP_SUMMARY

      - name: Sign binary (macOS)
        if: runner.os == 'macOS'
        run: |
          # Extract, sign, and repack
          tar -xzf ${{ matrix.artifact }}.tar.gz
          codesign -f -s - memex
          tar -czf ${{ matrix.artifact }}.tar.gz memex
          rm memex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/lite-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          sha256sum memex-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Memex Lite v${{ steps.version.outputs.version }}
          files: |
            memex-darwin-arm64.tar.gz
            memex-darwin-x64.tar.gz
            memex-linux-x64.tar.gz
            checksums.txt
          body: |
            ## Memex Lite v${{ steps.version.outputs.version }}

            Zero-dependency CLI tool for searching AI CLI session history.

            ### Install

            **macOS (Apple Silicon)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/memex-darwin-arm64.tar.gz | tar xz
            sudo mv memex /usr/local/bin/
            ```

            **macOS (Intel)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/memex-darwin-x64.tar.gz | tar xz
            sudo mv memex /usr/local/bin/
            ```

            **Linux (x86_64)**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/memex-linux-x64.tar.gz | tar xz
            sudo mv memex /usr/local/bin/
            ```

            **Homebrew (macOS)**
            ```bash
            brew install vimo-ai/tap/memex-lite
            ```

            ### Usage

            ```bash
            memex search "authentication"
            memex list -n 10
            memex sources
            ```

            ### Checksums

            See `checksums.txt` for SHA256 hashes.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
