name: Server

on:
  push:
    tags:
      - 'server-v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: memex-server-linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: memex-server-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ai-cli-session-db
        uses: actions/checkout@v4
        with:
          repository: vimo-ai/ai-cli-session-db
          path: deps/ai-cli-session-db

      - name: Checkout ai-cli-session-collector
        uses: actions/checkout@v4
        with:
          repository: vimo-ai/ai-cli-session-collector
          path: deps/ai-cli-session-collector

      - name: Create symlinks for dependencies
        run: |
          ln -s $GITHUB_WORKSPACE/deps/ai-cli-session-db $GITHUB_WORKSPACE/../ai-cli-session-db
          ln -s $GITHUB_WORKSPACE/deps/ai-cli-session-collector $GITHUB_WORKSPACE/../ai-cli-session-collector

      - name: Install protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: memex-rs
          shared-key: server-${{ matrix.target }}

      - name: Build
        working-directory: memex-rs
        run: |
          cargo build --release --no-default-features --bin memex-server --features server-mode --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/memex-server

      - name: Prepare artifact
        run: |
          cp memex-rs/target/${{ matrix.target }}/release/memex-server ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

          SIZE=$(stat -c%s "${{ matrix.artifact }}")
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${SIZE_MB}MB" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 30

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: memex-server-linux-x64
          path: docker/build/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: memex-server-linux-arm64
          path: docker/build/arm64

      - name: Fix permissions
        run: |
          chmod +x docker/build/amd64/memex-server
          chmod +x docker/build/arm64/memex-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.server
          platforms: linux/amd64
          build-args: TARGETARCH=amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}-amd64

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.server
          platforms: linux/arm64
          build-args: TARGETARCH=arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}-arm64

      - name: Create manifest
        run: |
          TAG="${{ github.ref_name }}"
          IMAGE="ghcr.io/${{ github.repository }}-server"
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"

      - name: Summary
        run: |
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}-server:latest\`" >> $GITHUB_STEP_SUMMARY
