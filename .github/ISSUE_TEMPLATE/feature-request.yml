name: "⭐ Feature Request"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see?
      placeholder: |
        I'd like to ...

        Use case: ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Web UI
        - MCP / API
        - Documentation
        - Other
    validations:
      required: false
