services:
  memex:
    build:
      context: .
      dockerfile: Dockerfile.rust
    image: memex-rs:latest
    container_name: memex
    restart: unless-stopped
    ports:
      - "10013:10013"
    volumes:
      - ~/.vimo/db:/data
      - ~/.claude/projects:/claude:ro
      - ~/.codex:/codex:ro
      - ~/.local/share/opencode:/opencode:ro
      - ~/.gemini/tmp:/gemini:ro
    environment:
      - RUST_LOG=memex=info
      # Ollama 连接 (语义搜索核心功能)
      - OLLAMA_API=http://host.docker.internal:11434
      - EMBEDDING_MODEL=bge-m3
      # AI 问答功能 (可选，需要 chat 模型)
      - ENABLE_AI_CHAT=false
      - CHAT_MODEL=qwen3:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"
